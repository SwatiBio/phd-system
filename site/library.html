<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — library</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
  <style>
    .lib-chips { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; }
    .lib-chip {
      font: inherit; font-size: 12px; font-weight: 500; padding: .2rem .5rem;
      border: 1px solid var(--border); border-radius: 999px; background: transparent;
      color: var(--muted-foreground); cursor: pointer; transition: all 120ms ease;
    }
    .lib-chip:hover { background: var(--muted); color: var(--foreground); }
    .lib-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .lib-toolbar { display: flex; gap: .5rem; align-items: center; margin-bottom: .75rem; }
    .lib-search { flex: 1; max-width: 24rem; }
    .lib-count { color: var(--muted-foreground); font-size: 12px; margin-left: auto; white-space: nowrap; }
    .lib-tagindex { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: 12px; }
    .lib-tagindex a { color: var(--muted-foreground); text-decoration: none; }
    .lib-tagindex a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
    .lib-row {
      display: block; padding: .65rem .5rem;
      border-bottom: 1px solid var(--muted); border-radius: .375rem;
    }
    .lib-row:hover { background: var(--muted); }
    .lib-row-title { font-weight: 600; }
    .lib-row-meta { font-size: 12px; color: var(--muted-foreground); margin-top: .125rem; }
    .lib-preview { font-size: 13px; color: var(--muted-foreground); margin-top: .25rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    /* tag group headings follow the app's group-heading pattern (uppercase,
       letterspaced, muted) and sit on a generous top margin so each tag
       section reads as its own band, not a wall of rows */
    .lib-group { margin-top: 1.75rem; }
    .lib-group h2 {
      font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--muted-foreground); margin: 0 0 .25rem;
    }
    /* Status badges use the Basecoat badge component + its documented colored
       pattern (bg-*-50 text-*-700, dark:bg-*-950 dark:text-*-300) so both
       themes pass WCAG AA. The old hand-rolled colors were light-theme hex
       that never flipped in dark mode. */
  </style>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <h1>Library</h1>
        <p class="meta">Your papers · edit in the <a href="/admin/#/collections/papers">CMS</a></p>
        <span style="flex:1"></span>
        <button type="button" class="btn" data-variant="outline" data-size="sm" id="sync-btn">
          <i class="ph ph-arrows-clockwise"></i> Sync from Zotero
        </button>
      </header>

      <div id="app" hidden>
        <div class="lib-toolbar">
          <input class="input lib-search" type="search" id="lib-search" placeholder="Search title, author, tag…" aria-label="Search papers" />
          <select class="input" id="lib-sort" aria-label="Sort papers" style="width:auto">
            <option value="title">Sort: title</option>
            <option value="status">Sort: status</option>
          </select>
          <span class="lib-count" id="lib-meta" aria-live="polite"></span>
        </div>
        <div class="lib-chips" style="margin-bottom:.5rem">
          <span id="status-chips" class="lib-chips"></span>
          <button type="button" class="lib-chip" id="personal-chip" aria-pressed="false" aria-label="Show personal papers">personal</button>
        </div>
        <nav class="lib-tagindex" id="tag-index" aria-label="Tag index"></nav>
        <div id="paper-groups"></div>
      </div>
      <p class="task-none" id="lib-error" hidden></p>
      <div id="toaster" class="toaster"></div>
    </div>
  </main>

  <script src="/site/lib/shell.js" defer blocking="render"></script>
  <script type="module" defer>
    import * as vault from "/site/lib/vault.js";
    import { STATUSES, load, filterStatus, search, statusCounts, groupByTag, sortPapers, preview } from "/site/lib/library.js";
    import { esc } from "/site/lib/html.js";

    const $ = (id) => document.getElementById(id);
    let papers = [];
    let state = { status: "all", personal: false, q: "", sort: "title" };
    /* Basecoat colored-badge pattern from the docs (contrast-checked both themes). */
    const BADGE = {
      "to-read": "bg-slate-50 text-slate-600 dark:bg-slate-800 dark:text-slate-300",
      reading: "bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300",
      read: "bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-300",
      parked: "bg-muted text-muted-foreground",
    };
    const fmtAuthors = (p) => {
      if (!p.authors.length) return "";
      const first = p.authors[0].replace(/^["']|["']$/g, "");
      return `${first}${p.authors.length > 1 ? " et al." : ""}`;
    };

    function renderChips() {
      const counts = statusCounts(papers.filter((p) => state.personal || p.category === "phd"));
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      $("status-chips").innerHTML =
        `<button type="button" class="lib-chip" data-status="all" aria-pressed="${state.status === "all"}">All · ${total}</button>` +
        STATUSES.map(
          (s) => `<button type="button" class="lib-chip" data-status="${s}" aria-pressed="${state.status === s}">${s} · ${counts[s]}</button>`
        ).join("");
      for (const b of $("status-chips").querySelectorAll("[data-status]"))
        b.addEventListener("click", () => { state.status = b.dataset.status; render(); });
    }

    function render() {
      const pool = papers.filter((p) => state.personal || p.category === "phd");
      const visible = filterStatus(search(pool, state.q), state.status);
      renderChips();
      $("personal-chip").setAttribute("aria-pressed", String(state.personal));

      const groups = sortPapers(visible, state.sort);
      const byTag = groupByTag(groups);
      $("tag-index").innerHTML = byTag
        .map((g) => `<a href="#tag-${esc(g.tag)}">${esc(g.tag)} (${g.papers.length})</a>`)
        .join("");

      $("paper-groups").innerHTML =
        byTag
          .map(
            (g) => `
        <section id="tag-${esc(g.tag)}" class="lib-group">
          <h2>${esc(g.tag)} <span class="meta">· ${g.papers.length}</span></h2>
          ${g.papers
            .map(
              (p) => `
          <a class="lib-row" href="/paper.html?path=${encodeURIComponent(p.path)}">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span class="lib-row-title">${esc(p.title)}</span>
              <span class="badge ${BADGE[p.status] || ""}">${p.status}</span>
            </div>
            <div class="lib-row-meta">${esc(fmtAuthors(p))}</div>
            ${preview(p) ? `<div class="lib-preview">${esc(preview(p))}</div>` : ""}
          </a>`
            )
            .join("")}
        </section>`
          )
          .join("") || emptyState();

      $("lib-meta").textContent = `${visible.length} of ${pool.length} shown`;
      $("clear-search")?.addEventListener("click", () => {
        state.q = "";
        $("lib-search").value = "";
        render();
        $("lib-search").focus();
      });
    }

    /* Empty states are doorways: say why it's empty and what to do next. */
    function emptyState() {
      if (!papers.length)
        return `<p class="task-none">Your library is empty. Add a paper from the <a href="/">today page</a>, or sync from Zotero.</p>`;
      if (state.q)
        return `<p class="task-none">No papers match “${esc(state.q)}”. <button type="button" class="lib-chip" id="clear-search">Clear the search</button></p>`;
      return `<p class="task-none">No papers match these filters.</p>`;
    }

    async function boot() {
      try {
        const w = await fetch("/api/whoami");
        if (!w.ok) { location.href = "/login"; return; }
        const j = await w.json();
        if (!j.login) { location.href = "/login"; return; }
        if (j.token_ok === false) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; return; }
        papers = await load(vault);
        $("personal-chip").addEventListener("click", () => { state.personal = !state.personal; render(); });
        $("lib-search").addEventListener("input", (e) => { state.q = e.target.value; render(); });
        $("lib-sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
        // Sync from Zotero — triggers the zotero-import workflow, which runs
        // in the background. The button only reports the request result; the
        // toast carries what happens next. Pure logic stays in library.js;
        // this is DOM wiring only.
        const syncBtn = $("sync-btn");
        const flash = (msg, category = "success") => {
          document.getElementById("toaster")?.toast({
            category,
            title: msg,
            cancel: { label: "Dismiss" },
          });
        };
        syncBtn.addEventListener("click", async () => {
          syncBtn.disabled = true;
          syncBtn.innerHTML = '<i class="ph ph-spinner"></i> Syncing…';
          try {
            const res = await fetch("/api/zotero/sync", { method: "POST" });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
              flash("Sync started — new papers appear here within a minute.");
            } else {
              flash(`Sync failed — ${(data.error || "the server refused").slice(0, 60)}. Try again in a minute.`, "error");
            }
          } catch {
            flash("Sync failed — check your connection and try again.", "error");
          }
          syncBtn.innerHTML = '<i class="ph ph-arrows-clockwise"></i> Sync from Zotero';
          syncBtn.disabled = false;
        });
        $("app").hidden = false;
        render();
      } catch (e) {
        $("lib-error").hidden = false;
        $("lib-error").textContent = `Could not load: ${e.message.slice(0, 100)}`;
      }
    }
    boot();
  </script>
</body>
</html>

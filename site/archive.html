<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — logbook archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: rgb(0 0 0 / 100%);
      --ink-2: rgb(0 0 0 / 64%);
      --ink-3: rgb(0 0 0 / 56%);
      --border: rgb(0 0 0 / 10%);
      --hover: rgb(0 0 0 / 4%);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: #fff;
      font-feature-settings: "tnum" 1;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 40px 24px 96px; }
    @media (min-width: 768px) { main { padding: 64px 24px 96px; } }
    .crumb { display: inline-block; margin-bottom: 24px; color: var(--ink-3); font-size: 15px; text-decoration: none; }
    .crumb:hover { color: var(--ink); }
    .nav { display: flex; align-items: baseline; gap: 18px; margin-bottom: 40px; font-size: 14px; }
    .nav .brand { font-weight: 600; margin-right: 10px; }
    .nav a { color: var(--ink-3); text-decoration: none; }
    .nav a:hover, .nav a:focus-visible { color: var(--ink); }
    .nav a[aria-current] { color: var(--ink); font-weight: 500; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
    .meta { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
    .year { font-size: 15px; font-weight: 600; margin-top: 40px; }
    .week {
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 12px 10px; border-bottom: 1px solid var(--border);
      text-decoration: none; color: var(--ink); border-radius: 6px;
    }
    .week:hover { background: var(--hover); }
    .week .range { font-weight: 500; font-size: 16px; }
    .week .stats { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
    .week.quiet .range { color: var(--ink-2); font-weight: 400; }
    .thisweek { font-size: 13px; color: var(--ink-3); margin-left: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
        <nav class="nav" aria-label="Site">
      <a class="brand" href="/">PhD-OS</a>
      <a href="/">Today</a>
      <a href="/tasks.html">Tasks</a>
      <a href="/timeline.html">Timeline</a>
      <a href="/review.html">Review</a>
      <a href="/archive.html" aria-current="page">Archive</a>
      <a href="/digest.html">Digest</a>
      <a href="/admin/">CMS</a>
      <a href="/logout">Sign out</a>
    </nav>
    <h1>Logbook archive</h1>
    <p class="meta">Every week of your PhD. Click a week to view or print it.</p>
    <div id="list"><p class="meta">Loading…</p></div>
  </main>

  <script type="module">
    import { weekPath, weekStart, parseLog } from "/site/lib/logs.js";
    const iso = (d) => d.toISOString().slice(0, 10);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    const now = new Date();
    const thisMonday = mondayOf(now);

    // start month: registration month (from milestones) with fallback
    let startDate = "2026-09-15";
    try {
      const m = await fetch("/system/milestones/milestones.md");
      if (m.ok) {
        const reg = (await m.text()).match(/^reg:\s*(\d{4}-\d{2}-\d{2})/m);
        if (reg) startDate = reg[1];
      }
    } catch {}

    // Weeks are files, and nothing can list a directory — so probe backwards from this
    // week and stop after a run of quiet ones. A week with no entries has no file.
    const floor = new Date(weekStart(startDate));
    floor.setDate(floor.getDate() - 28);
    const weeks = [];
    let misses = 0;
    for (let i = 0; i < 120 && misses < 8; i++) {
      const monday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - i * 7);
      if (monday < floor) break;
      const r = await fetch("/" + weekPath(monday));
      if (!r.ok) { if (weeks.length) misses++; continue; }
      const days = parseLog(await r.text());
      const dates = Object.keys(days);
      weeks.push({
        monday: iso(monday),
        entries: dates.reduce((s, d) => s + days[d].length, 0),
        logged: dates.length,
      });
      misses = 0;
    }   // already newest-first

    // render grouped by year
    const list = $("list");
    if (!weeks.length) {
      list.innerHTML = `<p class="meta">No weeks yet — log your first entry on the morning page.</p>`;
    } else {
      let html = "", lastYear = "";
      for (const wk of weeks) {
        const year = wk.monday.slice(0, 4);
        if (year !== lastYear) { lastYear = year; html += `<div class="year">${year}</div>`; }
        const end = new Date(wk.monday + "T12:00:00"); end.setDate(end.getDate() + 6);
        const fmt = (s) => new Date(s + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        const isThis = wk.monday === iso(thisMonday);
        const quiet = wk.entries === 0 ? " quiet" : "";
        const stats = wk.entries === 0 ? "no entries" : `${wk.entries} entr${wk.entries > 1 ? "ies" : "y"} · ${wk.logged}/7 days`;
        html += `<a class="week${quiet}" href="/logbook.html?week=${wk.monday}">
          <span class="range">${fmt(wk.monday)} – ${fmt(iso(end))}${isThis ? ' <span class="thisweek">this week</span>' : ""}</span>
          <span class="stats">${stats}</span></a>`;
      }
      list.innerHTML = html;
    }
  </script>
  <script type="module">
    try { const j = await (await fetch("/api/whoami")).json(); if (!j.login) document.querySelectorAll('a[href="/logout"]').forEach((a) => (a.hidden = true)); } catch {}
  </script>
</body>
</html>

</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — tasks</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta" id="meta">Loading…</p>
      </header>

      <div class="card mb-6">
        <section>
          <form class="add-row" id="add-form">
            <input class="input" type="text" id="add-text" placeholder="Add a task — one line" autocomplete="off" aria-label="New task" maxlength="200" />
            <input class="input" type="date" id="add-due" aria-label="Due date (optional)" />
            <button class="btn" type="submit" id="add-btn">Add</button>
          </form>
          <p class="add-note" id="add-note"></p>
        </section>
      </div>

      <div class="card">
        <section>
          <div class="taskwrap" id="content"></div>
        </section>
      </div>

      <footer class="page-footer">
        Tick done here — it commits straight to the task's own file (<code>daily/tasks/&lt;slug&gt;.md</code>).
      </footer>
    </div>
  </main>

  <!-- edit panel overlay -->
  <dialog id="edit-dialog" class="dialog" aria-labelledby="edit-title" onclick="if (event.target === this) this.close()">
    <form method="dialog" id="edit-form">
      <header>
        <h2 id="edit-title"></h2>
        <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" id="edit-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>
      <section>
        <label class="label">Status
          <select class="input" id="edit-status">
            <option value="backlog">Backlog</option>
            <option value="todo">To do</option>
            <option value="in-progress">In progress</option>
            <option value="done">Done</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label class="label">Due date
          <input class="input" type="date" id="edit-due" />
        </label>
        <label class="label">Recurring
          <select class="input" id="edit-recurring">
            <option value="">None</option>
            <option value="day">Daily</option>
            <option value="week">Weekly</option>
            <option value="2 weeks">Every 2 weeks</option>
            <option value="month">Monthly</option>
            <option value="6 months">Every 6 months</option>
            <option value="year">Yearly</option>
          </select>
        </label>
        <label class="label">Notes
          <textarea class="input" id="edit-notes" rows="4" placeholder="Optional notes…"></textarea>
        </label>
      </section>
      <footer>
        <button class="btn" type="submit" id="edit-save">Save</button>
        <span class="add-note" id="edit-note"></span>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/site/lib/shell.js" blocking="render"></script>
  <script type="module">
    import * as tasks from "/site/lib/tasks.js";
    import * as vault from "/site/lib/vault.js";

    /* local date, not UTC: toISOString is a day behind before ~5:30am IST */
    const localIso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const todayIso = localIso(new Date());
    const $ = (id) => document.getElementById(id);
    const daysUntil = (dStr) => Math.round((new Date(dStr + "T12:00:00") - new Date(todayIso + "T12:00:00")) / 86400000);
    const fmt = (dStr) => new Date(dStr + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

    /* --- collapse state (per-group, persisted) --- */
    const COLLAPSE_KEY = "phdos_task_groups";
    let collapsed = {};
    try { collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "{}"); } catch {}
    function saveCollapse() {
      try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch {}
    }

    /* --- edit dialog --- */
    let editingTask = null;
    function openEdit(t) {
      editingTask = t;
      $("edit-title").textContent = t.title;
      $("edit-status").value = t.status;
      $("edit-due").value = t.due || "";
      $("edit-recurring").value = t.recurring || "";
      $("edit-notes").value = t.notes || "";
      $("edit-note").textContent = "";
      $("edit-dialog").showModal();
    }
    $("edit-close").addEventListener("click", () => $("edit-dialog").close());
    $("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!editingTask) return;
      const btn = $("edit-save");
      btn.disabled = true;
      const next = {
        ...editingTask,
        status: $("edit-status").value,
        due: $("edit-due").value || null,
        recurring: $("edit-recurring").value || null,
        notes: $("edit-notes").value,
      };
      try {
        await vault.put(editingTask.path, serializeTask(next), `task edit: ${editingTask.title}`);
        $("edit-dialog").close();
        await renderAll(true);
      } catch (err) {
        $("edit-note").textContent = `Could not save: ${err.message.slice(0, 80)}`;
      }
      btn.disabled = false;
    });

    function serializeTask(t) {
      const lines = ["---"];
      for (const [k, v] of [["title", t.title], ["status", t.status], ["due", t.due], ["recurring", t.recurring], ["last-done", t.lastDone]]) {
        if (v != null && v !== "") lines.push(`${k}: ${v}`);
      }
      lines.push("---", "");
      const notes = (t.notes || "").trim();
      return lines.join("\n") + (notes ? `${notes}\n` : "");
    }

    /* --- rendering --- */
    function row(t) {
      const li = document.createElement("li");
      li.dataset.text = t.title;
      const open = tasks.isOpen(t);
      if (!open) li.className = "done";

      // tick button
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.dataset.size = "icon-sm";
      btn.dataset.variant = "ghost";
      btn.dataset.variant = "ghost";
      btn.type = "button";
      btn.textContent = "✓";
      btn.setAttribute("aria-label", open ? "Mark done" : "Reopen");
      btn.disabled = true;

      const body = document.createElement("div");
      body.className = "body";

      // title row
      const titleRow = document.createElement("div");
      titleRow.className = "task-title";
      titleRow.textContent = t.title;
      if (t.recurring) {
        const badge = document.createElement("span");
        badge.className = "rec";
        badge.textContent = t.recurring;
        titleRow.appendChild(badge);
      }
      if (t.lastDone) {
        const doneBadge = document.createElement("span");
        doneBadge.className = "rec rec-done";
        doneBadge.textContent = `done ${fmt(t.lastDone)}`;
        titleRow.appendChild(doneBadge);
      }
      body.appendChild(titleRow);

      // due line
      if (t.due) {
        const when = document.createElement("div");
        const d = daysUntil(t.due);
        when.className = "when";
        when.textContent = !open ? `${t.status === "cancelled" ? "cancelled" : "was due"} ${fmt(t.due)}`
          : d < 0 ? `overdue by ${-d} day${-d === 1 ? "" : "s"} · ${fmt(t.due)}`
          : d === 0 ? "due today"
          : `due ${fmt(t.due)} (in ${d} day${d === 1 ? "" : "s"})`;
        body.appendChild(when);
      } else {
        const when = document.createElement("div");
        when.className = "when";
        when.textContent = "no date";
        body.appendChild(when);
      }

      // notes preview
      if (t.notes) {
        const preview = document.createElement("div");
        preview.className = "task-notes-preview";
        preview.textContent = t.notes.replace(/\n/g, " ").slice(0, 80);
        body.appendChild(preview);
      }

      li.append(btn, body);

      // tick handler
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        btn.disabled = true;
        try {
          await tasks.setStatus(vault, t, tasks.isOpen(t) ? "done" : "todo");
          await renderAll(true);
        } catch (err) {
          btn.disabled = false;
          $("meta").textContent = `Could not save: ${err.message.slice(0, 80)}`;
        }
      });

      // click-to-edit (not on the tick button)
      li.addEventListener("click", (e) => {
        if (e.target === btn || btn.contains(e.target)) return;
        openEdit(t);
      });
      li.style.cursor = "pointer";

      return li;
    }

    function group(title, items, key) {
      if (!items.length) return null;
      const wrap = document.createElement("section");
      wrap.dataset.group = key;
      const h = document.createElement("h2");
      h.className = "group-heading";
      h.innerHTML = `<span>${esc(title)} · ${items.length}</span><i class="ph ph-caret-down group-chevron"></i>`;
      // keyboard-accessible collapse: the heading is a button in behaviour
      h.tabIndex = 0;
      h.setAttribute("role", "button");
      h.style.cursor = "pointer";
      const ul = document.createElement("ul");
      for (const t of items) ul.appendChild(row(t));
      wrap.append(h, ul);

      // collapse
      const setOpen = (open) => {
        ul.hidden = !open;
        collapsed[key] = !open;
        h.setAttribute("aria-expanded", String(open));
        saveCollapse();
        h.querySelector(".group-chevron").style.transform = open ? "" : "rotate(-90deg)";
      };
      if (collapsed[key]) {
        ul.hidden = true;
        h.setAttribute("aria-expanded", "false");
        h.querySelector(".group-chevron").style.transform = "rotate(-90deg)";
      } else {
        h.setAttribute("aria-expanded", "true");
      }
      h.addEventListener("click", () => setOpen(!ul.hidden));
      h.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen(!ul.hidden); }
      });

      return wrap;
    }

    async function renderAll(isReload) {
      const box = $("content");
      if (!isReload) box.innerHTML = "";
      let all;
      try {
        all = await tasks.load(vault);
      } catch (e) {
        $("meta").textContent = "";
        box.innerHTML = `<p class="empty">Could not load tasks: ${e.message}</p>`;
        return;
      }

      // split open vs closed, then bucket open tasks
      const open = all.filter((t) => tasks.isOpen(t));
      const closed = all.filter((t) => !tasks.isOpen(t)).sort((a, b) => (b.due || "").localeCompare(a.due || ""));

      // for recurring tasks with lastDone: show a done-copy in the closed list
      const doneCopies = [];
      const realOpen = [];
      for (const t of open) {
        if (t.lastDone && t.recurring) {
          doneCopies.push({ ...t, status: "done", _isCopy: true });
          realOpen.push({ ...t, lastDone: null }); // the open occurrence
        } else {
          realOpen.push(t);
        }
      }

      const backlog = realOpen.filter((t) => t.status === "backlog");
      const dated = realOpen.filter((t) => t.status !== "backlog");
      const overdue = dated.filter((t) => t.due && daysUntil(t.due) < 0).sort((a, b) => a.due.localeCompare(b.due));
      const soon = dated.filter((t) => t.due && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 14).sort((a, b) => a.due.localeCompare(b.due));
      const later = dated.filter((t) => t.due && daysUntil(t.due) > 14).sort((a, b) => a.due.localeCompare(b.due));
      const undated = dated.filter((t) => !t.due);
      const allClosed = [...closed, ...doneCopies].sort((a, b) => (b.due || "").localeCompare(a.due || ""));

      $("meta").textContent = `${dated.length} open · ${overdue.length} overdue · ${allClosed.length} done/cancelled`;
      box.innerHTML = "";
      if (!all.length) {
        box.innerHTML = `<p class="empty">No tasks yet — add the first one above.</p>`;
        return;
      }
      for (const [title, items, key] of [
        ["Overdue", overdue, "overdue"],
        ["Next 14 days", soon, "soon"],
        ["Later", later, "later"],
        ["No date", undated, "undated"],
        ["Backlog", backlog, "backlog"],
        ["Done / cancelled", allClosed, "closed"],
      ]) {
        const g = group(title, items, key);
        if (g) box.appendChild(g);
      }
      for (const b of box.querySelectorAll(".btn[data-size]")) b.disabled = false;

      // focus from homepage
      const focus = new URLSearchParams(location.search).get("focus");
      if (focus && !isReload) {
        const hit = [...box.querySelectorAll("li")].find((li) => li.dataset.text === focus);
        if (hit) {
          hit.classList.add("focus");
          hit.scrollIntoView({ block: "center" });
        }
      }
    }

    $("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("add-text").value.trim();
      if (!text) return;
      const btn = $("add-btn");
      btn.disabled = true;
      $("add-note").textContent = "";
      try {
        await tasks.create(vault, { title: text, due: $("add-due").value || null });
        $("add-text").value = "";
        $("add-due").value = "";
        $("add-note").textContent = "Added.";
        await renderAll(true);
      } catch (err) {
        $("add-note").textContent = `Could not add: ${err.message.slice(0, 90)}`;
      }
      btn.disabled = false;
    });

    await renderAll(false);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — tasks</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <h1>Tasks</h1>
        <p class="meta" id="meta">Loading…</p>
      </header>

      <div class="card mb-6">
        <section>
          <form class="add-row" id="add-form">
            <input class="input" type="text" id="add-text" placeholder="Add a task — one line" autocomplete="off" aria-label="New task" />
            <input class="input" type="date" id="add-due" aria-label="Due date (optional)" />
            <button class="btn" type="submit" id="add-btn">Add</button>
          </form>
          <p class="add-note" id="add-note"></p>
        </section>
      </div>

      <div class="card">
        <section>
          <div class="taskwrap" id="content"></div>
        </section>
      </div>

      <footer class="page-footer">
        Tick done here — it commits straight to <code>daily/tasks/tasks.md</code>.
        To add or edit tasks, use <a href="/admin/#/collections/tasks">the CMS</a>.
      </footer>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js"></script>
  <script type="module">
    import { parseTasks, withTaskDone, withTaskAdded } from "/site/lib/tasks.js";
    import { get, put } from "/site/lib/vault.js";

    const todayIso = new Date().toISOString().slice(0, 10);
    const $ = (id) => document.getElementById(id);
    const daysUntil = (dStr) => Math.round((new Date(dStr + "T12:00:00") - new Date(todayIso + "T12:00:00")) / 86400000);
    const fmt = (dStr) => new Date(dStr + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

    function row(t) {
      const li = document.createElement("li");
      li.dataset.text = t.text;
      if (t.done) li.className = "done";
      const btn = document.createElement("button");
      btn.className = "tick";
      btn.type = "button";
      btn.textContent = "✓";
      btn.setAttribute("aria-label", t.done ? "Mark not done" : "Mark done");
      btn.disabled = true;                       // enabled after render, so a failed save cannot double-fire
      const body = document.createElement("div");
      body.className = "body";
      const label = document.createElement("div");
      label.textContent = t.text;
      if (t.recurring) {
        const rec = document.createElement("span");
        rec.className = "rec";
        rec.textContent = "recurring";
        label.appendChild(rec);
      }
      body.appendChild(label);
      if (t.due) {
        const when = document.createElement("div");
        const d = daysUntil(t.due);
        when.className = "when" + (d < 0 && !t.done ? " overdue" : "");
        when.textContent = t.done ? `was due ${fmt(t.due)}`
          : d < 0 ? `overdue by ${-d} day${-d === 1 ? "" : "s"} · ${fmt(t.due)}`
          : d === 0 ? "due today"
          : `due ${fmt(t.due)} (in ${d} day${d === 1 ? "" : "s"})`;
        body.appendChild(when);
      } else {
        const when = document.createElement("div");
        when.className = "when";
        when.textContent = "no date";
        body.appendChild(when);
      }
      if (t.section) {
        const src = document.createElement("div");
        src.className = "src";
        src.textContent = t.section;
        body.appendChild(src);
      }
      li.append(btn, body);
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          const f = await get("daily/tasks/tasks.md");
          await put("daily/tasks/tasks.md", withTaskDone(f?.text ?? "", t.raw, !t.done), `${t.done ? "task reopened" : "task done"}: ${t.text.slice(0, 50)}`);
          await load(true);
        } catch (e) {
          btn.disabled = false;
          $("meta").textContent = `Could not save: ${e.message.slice(0, 80)}`;
        }
      });
      return li;
    }

    function group(title, items) {
      if (!items.length) return null;
      const wrap = document.createElement("section");
      const h = document.createElement("h2");
      h.textContent = `${title} · ${items.length}`;
      const ul = document.createElement("ul");
      for (const t of items) ul.appendChild(row(t));
      wrap.append(h, ul);
      return wrap;
    }

    async function load(isReload) {
      const box = $("content");
      if (!isReload) box.innerHTML = "";
      let text;
      try {
        const f = await get("daily/tasks/tasks.md");
        text = f ? f.text : "";
      } catch (e) {
        $("meta").textContent = "";
        box.innerHTML = `<p class="empty">Could not load tasks: ${e.message}</p>`;
        return;
      }
      const all = parseTasks(text);
      const open = all.filter((t) => !t.done);
      const overdue = open.filter((t) => t.due && daysUntil(t.due) < 0).sort((a, b) => a.due.localeCompare(b.due));
      const soon = open.filter((t) => t.due && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 14).sort((a, b) => a.due.localeCompare(b.due));
      const later = open.filter((t) => t.due && daysUntil(t.due) > 14).sort((a, b) => a.due.localeCompare(b.due));
      const undated = open.filter((t) => !t.due);
      const done = all.filter((t) => t.done);
      done.sort((a, b) => (b.due || "").localeCompare(a.due || ""));

      $("meta").textContent = `${open.length} open · ${overdue.length} overdue · ${done.length} done`;
      box.innerHTML = "";
      if (!all.length) {
        box.innerHTML = `<p class="empty">No tasks in the file yet.</p>`;
        return;
      }
      for (const [title, items] of [["Overdue", overdue], ["Next 14 days", soon], ["Later", later], ["No date", undated], ["Done", done]]) {
        const g = group(title, items);
        if (g) box.appendChild(g);
      }
      for (const b of box.querySelectorAll(".tick")) b.disabled = false;

      // arrived from the homepage list — put the task in view
      const focus = new URLSearchParams(location.search).get("focus");
      if (focus && !isReload) {
        const hit = [...box.querySelectorAll("li")].find((li) => li.dataset.text === focus);
        if (hit) {
          hit.classList.add("focus");
          hit.scrollIntoView({ block: "center" });
        }
      }
    }

    $("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("add-text").value.trim();
      if (!text) return;
      const btn = $("add-btn");
      btn.disabled = true;
      $("add-note").textContent = "";
      try {
        const f = await get("daily/tasks/tasks.md");
        const updated = withTaskAdded(f ? f.text : "# Tasks\n", text, $("add-due").value || null);
        await put("daily/tasks/tasks.md", updated, `task added: ${text.slice(0, 50)}`);
        $("add-text").value = "";
        $("add-due").value = "";
        $("add-note").textContent = "Added.";
        await load(true);
      } catch (err) {
        $("add-note").textContent = `Could not add: ${err.message.slice(0, 90)}`;
      }
      btn.disabled = false;
    });

    await load(false);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — research logbook (week)</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta" id="week-label"></p>
      </header>

      <div class="card">
        <section>
          <div class="rtable" id="content"><p class="meta">Loading…</p></div>
        </section>
      </div>

      <div class="signatures">
        <div class="sig"><div class="line"></div><div class="who"><strong>Scholar:</strong> Swati · Date:</div></div>
        <div class="sig"><div class="line"></div><div class="who"><strong>Guide review &amp; approval (Section 19):</strong></div></div>
      </div>

      <div class="noprint">
        <button class="btn" onclick="window.print()">Print this page</button>
        <p class="mt-3 text-sm" style="color: var(--muted-foreground)">Print and hand to your guide weekly. Fresh saves take about a minute to appear here.</p>
      </div>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js"></script>
  <script type="module">
    import { weekPath, weekStart, weekLabel, parseLog } from "/site/lib/logs.js";
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const iso = (d) => d.toISOString().slice(0, 10);

    const now = new Date();
    const param = new URLSearchParams(location.search).get("week");
    const monday = /^\d{4}-\d{2}-\d{2}$/.test(param || "") ? weekStart(param) : weekStart(now);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      weekDays.push(iso(d));
    }

    const $ = (id) => document.getElementById(id);
    $("week-label").textContent = `${weekLabel(monday)} · Section 19 record`;

    // One file per ISO week — no date filtering left to do.
    const entries = {};
    {
      const r = await fetch("/" + weekPath(monday));
      if (r.ok) Object.assign(entries, parseLog(await r.text()));
    }

    const rows = [];
    let any = false;
    for (const d of weekDays) {
      const dayEntries = entries[d] || [];
      const label = new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      if (!dayEntries.length) {
        rows.push(`<tr class="daysep"><td class="date">${label}</td><td class="meta" colspan="3">—</td></tr>`);
        continue;
      }
      any = true;
      dayEntries.forEach((en, i) => {
        rows.push(`<tr${i === 0 ? ' class="daysep"' : ""}><td class="date">${i === 0 ? label : ""}</td><td class="time">${en.time}</td><td>${esc(en.text)}${en.tags ? ` <span class="tag">${esc(en.tags)}</span>` : ""}</td><td></td></tr>`);
      });
    }
    if (!any) {
      $("content").innerHTML = `<p class="empty">No entries this week yet. Log from the morning page — they appear here within a minute of saving.</p>`;
    } else {
      $("content").innerHTML = `
        <table class="grid">
          <thead><tr><th>Date</th><th>Time</th><th>Work carried out</th><th>Status / result</th></tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>`;
    }
  </script>
</body>
</html>

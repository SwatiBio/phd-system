<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — week in review</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta" id="meta">Loading…</p>
      </header>

      <div class="card">
        <section class="prose" id="content"></section>
      </div>

      <div class="upcoming" id="upcoming" hidden>
        <h2>Coming up</h2>
        <ul id="upcoming-list"></ul>
      </div>

      <a class="btn mt-8" data-variant="outline" href="/logbook.html">Logbook for your guide →</a>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js" blocking="render"></script>
  <script type="module">
    import { parseMilestones, daysUntil } from "/site/lib/milestones.js";
    import { render, esc } from "/site/lib/md.js";

    const pad2 = (n) => String(n).padStart(2, "0");
    /* local date, not UTC: toISOString is a day behind before ~5:30am IST */
    const todayIso = `${new Date().getFullYear()}-${pad2(new Date().getMonth() + 1)}-${pad2(new Date().getDate())}`;
    const $ = (id) => document.getElementById(id);

    try {
      const r = await fetch("/daily/reviews/latest.md");
      if (r.status === 404) {
        $("meta").textContent = "";
        $("content").innerHTML = `<p class="em">No review yet — the job runs Sunday evening.</p>`;
      } else if (!r.ok) {
        throw new Error(`HTTP ${r.status}`);
      } else {
        const md = await r.text();
        const prepared = (md.match(/^\*Prepared (.+?) by/m) || [])[1];
        const title = (md.match(/^# (.+)$/m) || [])[1] || "";
        $("meta").innerHTML = title ? esc(title) : "";
        if (prepared) $("meta").innerHTML += ` <span class="em">· prepared ${esc(prepared)}</span>`;
        const box = $("content");
        for (const n of render(md)) box.appendChild(n);
      }
    } catch (e) {
      $("meta").textContent = "";
      $("content").innerHTML = `<p class="em">Could not load the review: ${esc(e.message)}</p>`;
    }

    try {
      const mr = await fetch("/system/milestones/milestones.md");
      if (mr.ok) {
        const items = parseMilestones(await mr.text()).items.filter((i) => daysUntil(i.date, todayIso) >= 0).slice(0, 3);
        if (items.length) {
          $("upcoming").hidden = false;
          $("upcoming-list").innerHTML = items.map((i) => {
            const d = daysUntil(i.date, todayIso);
            const when = d === 0 ? "today" : `in ${d} day${d === 1 ? "" : "s"}`;
            return `<li><strong>${esc(i.title)}</strong> — ${i.date} · ${when}</li>`;
          }).join("");
        }
      }
    } catch {}
  </script>
</body>
</html>

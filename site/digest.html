<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — paper digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: rgb(0 0 0 / 100%);
      --ink-2: rgb(0 0 0 / 64%);
      --ink-3: rgb(0 0 0 / 56%);
      --border: rgb(0 0 0 / 10%);
      --hover: rgb(0 0 0 / 5%);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: #fff;
    }
    main { max-width: 44rem; margin: 0 auto; padding: 40px 24px 96px; }
    @media (min-width: 768px) { main { padding: 64px 24px 96px; } }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
    h2 { font-size: 17px; font-weight: 600; margin-top: 48px; }
    .meta { color: var(--ink-3); font-size: 14px; margin-top: 6px; }
    .em { color: var(--ink-2); font-style: italic; }
    ul { list-style: none; padding: 0; margin-top: 8px; }
    li { padding: 10px 0; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
    a:hover { text-decoration-color: var(--ink-3); }
    .who { color: var(--ink-2); font-size: 15px; }
    .crumb { display: inline-block; margin-bottom: 32px; color: var(--ink-3); font-size: 15px; text-decoration: none; }
    .crumb:hover { color: var(--ink); }
    .nav { display: flex; align-items: baseline; gap: 18px; margin-bottom: 40px; font-size: 14px; }
    .nav .brand { font-weight: 600; margin-right: 10px; }
    .nav a { color: var(--ink-3); text-decoration: none; }
    .nav a:hover, .nav a:focus-visible { color: var(--ink); }
    .nav a[aria-current] { color: var(--ink); font-weight: 500; }
    .zsave {
      font: inherit; font-size: 13px; font-weight: 500;
      margin-left: 10px; padding: 4px 10px;
      border: 1px solid var(--border); border-radius: 999px;
      background: none; color: var(--ink-2); cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
      touch-action: manipulation;
    }
    .zsave:hover { background: rgb(0 0 0 / 5%); color: var(--ink); }
    .zsave.done { background: var(--ink); color: #fff; border-color: var(--ink); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <nav class="nav" aria-label="Site">
      <a class="brand" href="/">PhD-OS</a>
      <a href="/">Today</a>
      <a href="/archive.html">Archive</a>
      <a href="/digest.html" aria-current="page">Digest</a>
      <a href="/admin/">CMS</a>
      <a href="/logout">Sign out</a>
    </nav>
    <div id="content"><p style="color: var(--ink-3)">Loading…</p></div>
  </main>
  <script type="module">
    const el = (h, c) => { const d = document.createElement(h); d.innerHTML = c; return d; };
    try {
      const r = await fetch("/research/papers/digest-latest.md");
      if (r.status === 404) { document.getElementById("content").innerHTML = "<p class='em'>No digest yet — the robot runs Monday mornings. Check back then.</p>"; }
      else {
        const md = (await r.text()).split("\n");
        const out = [];
        const pending = [];
        let list = null;
        const closeList = () => { list = null; };
        for (const line of md) {
          if (line.startsWith("# ")) { closeList(); out.push(el("h1", esc(line.slice(2)))); }
          else if (line.startsWith("## ")) { closeList(); out.push(el("h2", esc(line.slice(3)))); }
          else if (line.startsWith("*") && line.endsWith("*")) { out.push(el("p", `<span class="em">${inline(line.replace(/^\*|\*$/g, ""))}</span>`)); }
          else if (line.startsWith("- ")) {
            if (!list) { list = document.createElement("ul"); out.push(list); }
            const li = document.createElement("li");
            li.innerHTML = inline(line.slice(2));
            const doi = (line.match(/https:\/\/doi\.org\/(10\.[^)]+)/) || [])[1];
            if (doi) { li.dataset.doi = doi; pending.push(li); }
            list.appendChild(li);
          } else if (line.trim()) { closeList(); out.push(el("p", inline(line))); }
        }
        // "→ Zotero" buttons appear only when signed in (PHDOS flow: saves are you-only)
        try {
          const w = await fetch("/api/whoami");
          if (w.ok) for (const li of pending) li.appendChild(makeSaveBtn(li.dataset.doi));
        } catch {}
        function makeSaveBtn(doi) {
          const b = document.createElement("button");
          b.className = "zsave";
          b.textContent = "→ Zotero";
          b.addEventListener("click", async () => {
            b.disabled = true; b.textContent = "Saving…";
            try {
              const r = await fetch("/api/zotero/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doi }) });
              const j = await r.json().catch(() => ({}));
              if (r.ok && j.duplicate) { b.textContent = "Already in Zotero"; b.classList.add("done"); }
              else if (r.ok) { b.textContent = "Saved ✓"; b.classList.add("done"); }
              else { b.textContent = j.error || "Failed"; b.disabled = false; }
            } catch (e) { b.textContent = "Failed"; b.disabled = false; }
          });
          return b;
        }
        function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
        function inline(s) {
          return esc(s)
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        }
        const box = document.getElementById("content");
        box.innerHTML = "";
        for (const n of out) box.appendChild(n);
      }
    } catch (e) {
      document.getElementById("content").innerHTML = `<p class="em">Could not load digest: ${e.message}</p>`;
    }
  </script>
</body>
</html>

  <script type="module">
    try { const j = await (await fetch("/api/whoami")).json(); if (!j.login) document.querySelectorAll('a[href="/logout"]').forEach((a) => (a.hidden = true)); } catch {}
  </script>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — paper digest</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta">Fresh papers, Monday mornings.</p>
      </header>

      <div class="card">
        <section class="prose" id="content"><p class="meta">Loading…</p></section>
      </div>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js"></script>
  <script type="module">
    const el = (h, c) => { const d = document.createElement(h); d.innerHTML = c; return d; };
    try {
      const r = await fetch("/research/papers/digest-latest.md");
      if (r.status === 404) { document.getElementById("content").innerHTML = "<p class='em'>No digest yet — the robot runs Monday mornings. Check back then.</p>"; }
      else {
        const md = (await r.text()).split("\n");
        const out = [];
        const pending = [];
        let list = null;
        const closeList = () => { list = null; };
        for (const line of md) {
          if (line.startsWith("# ")) { closeList(); }                    // title is the page header now
          else if (line.startsWith("## ")) { closeList(); out.push(el("h2", esc(line.slice(3)))); }
          else if (line.startsWith("*") && line.endsWith("*")) { out.push(el("p", `<span class="em">${inline(line.replace(/^\*|\*$/g, ""))}</span>`)); }
          else if (line.startsWith("- ")) {
            if (!list) { list = document.createElement("ul"); out.push(list); }
            const li = document.createElement("li");
            li.innerHTML = inline(line.slice(2));
            const doi = (line.match(/https:\/\/doi\.org\/(10\.[^)]+)/) || [])[1];
            if (doi) { li.dataset.doi = doi; pending.push(li); }
            list.appendChild(li);
          } else if (line.trim()) { closeList(); out.push(el("p", inline(line))); }
        }
        // "→ Zotero" buttons appear only when signed in (PHDOS flow: saves are you-only)
        try {
          const w = await fetch("/api/whoami");
          if (w.ok) for (const li of pending) li.appendChild(makeSaveBtn(li.dataset.doi));
        } catch {}
        function makeSaveBtn(doi) {
          const b = document.createElement("button");
          b.className = "zsave";
          b.textContent = "→ Zotero";
          b.addEventListener("click", async () => {
            b.disabled = true; b.textContent = "Saving…";
            try {
              const r = await fetch("/api/zotero/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doi }) });
              const j = await r.json().catch(() => ({}));
              if (r.ok && j.duplicate) { b.textContent = "Already in Zotero"; b.classList.add("done"); }
              else if (r.ok) { b.textContent = "Saved ✓"; b.classList.add("done"); }
              else { b.textContent = j.error || "Failed"; b.disabled = false; }
            } catch (e) { b.textContent = "Failed"; b.disabled = false; }
          });
          return b;
        }
        function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
        function inline(s) {
          return esc(s)
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        }
        const box = document.getElementById("content");
        box.innerHTML = "";
        for (const n of out) box.appendChild(n);
      }
    } catch (e) {
      document.getElementById("content").innerHTML = `<p class="em">Could not load digest: ${e.message}</p>`;
    }
  </script>
</body>
</html>

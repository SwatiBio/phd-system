<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — today</title>
  <!-- apply stored/system theme before first paint (defaults to system when nothing saved) -->
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <!-- Phosphor icons (regular weight) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <!-- Basecoat UI + Tailwind utilities (order: Tailwind first, Basecoat after) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
</head>
<body>
  <!-- sidebar + top row are injected by /site/lib/shell.js -->
  <main>
    <div class="content">
      <div id="app" hidden>
        <header class="page-head">
        <h1 id="today-date" class="sr-only"></h1>
        <span class="streak" id="streak"></span>
      </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Due today -->
          <div class="card">
            <header class="px-5 py-4">
              <h3>Due today</h3>
            </header>
            <section id="task-body"><p class="skeleton">Loading…</p></section>
          </div>

          <!-- Log what you did -->
          <div class="card">
            <header class="px-5 py-4">
              <h3>Log what you did</h3>
              <p>A line or a paragraph — it becomes a logbook row.</p>
            </header>
            <section>
              <div class="log-field">
                <form class="log-row" id="log-form">
                  <textarea class="input log-input" id="log-text" rows="1" placeholder="What did you work on? Type # to tag…" autocomplete="off" aria-label="Log entry"></textarea>
                  <button class="btn" type="submit" id="log-submit">Log entry</button>
                </form>
                <div class="suggest" id="log-suggest" hidden></div>
              </div>
              <div class="chip-row" id="chips"></div>
              <p class="saved" id="log-saved" role="status" aria-live="polite"></p>
              <ul class="log-today" id="log-today" hidden></ul>
            </section>
          </div>

          <!-- Next milestone -->
          <div class="card">
            <header class="px-5 py-4">
              <h3>Next milestone</h3>
              <p>Computed from the registration date — nothing stored.</p>
            </header>
            <section id="deadline-body"><p class="skeleton">Loading…</p></section>
          </div>

          <!-- New papers -->
          <div class="card" id="digest-section" hidden>
            <header class="px-5 py-4">
              <h3>New papers this week</h3>
            </header>
            <section><p class="task-none" id="digest-line"></p></section>
          </div>
        </div>

        <footer class="page-footer">
          Edits commit straight to your vault.
        </footer>
      </div>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js"></script>
  <script type="module">
    import { parseMilestones } from "/site/lib/milestones.js";
    import * as tasks from "/site/lib/tasks.js";
    import { weekPath, appendEntry, weekStart, parseLog, toEntryLineText, iso } from "/site/lib/logs.js";
    import {
      CURATED, TAG_DESCRIPTIONS, hasTag, insertTag, removeTag,
      suggest, newAdHocs, parseRegistry, registryText, tagAtCaret,
    } from "/site/lib/tags.js";
    import { get, put, list } from "/site/lib/vault.js";

    const demo = new URLSearchParams(location.search).get("demo") === "1";

    /* ---------- date helpers ---------- */
    const today = new Date();
    const todayIso = iso(today);
    const fmtDay = (d) => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    const daysUntil = (dStr) => Math.round((new Date(dStr + "T12:00:00") - new Date(todayIso + "T12:00:00")) / 86400000);

    const $ = (id) => document.getElementById(id);
    /* escape for the log/ today spans — the week file is hand-authored */
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let registry = new Map(); // daily/tags.md: ad-hoc tag -> first-seen date

    /* ---------- parsers ---------- */
    function nextMilestone(text) {
      const m = parseMilestones(text).items.find((i) => daysUntil(i.date) >= 0);
      return m ? { title: m.title, date: m.date, days: daysUntil(m.date) } : null;
    }
    function loggedDates(text) {
      const set = new Set();
      for (const m of text.matchAll(/^## (\d{4}-\d{2}-\d{2})$/gm)) set.add(m[1]);
      return set;
    }
    /* ---------- render ---------- */

    /* Everything due today, overdue included. Read-only here: each row links to the
       tasks page, which is the one place ticking happens. */
    const shortDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    function taskRow(t) {
      const d = daysUntil(t.due);
      const li = document.createElement("li");
      li.className = "task-row" + (d < 0 ? " overdue" : "");
      const a = document.createElement("a");
      a.href = `/tasks.html?focus=${encodeURIComponent(t.title)}`;
      const label = document.createElement("span");
      label.className = "t";
      label.textContent = t.title;
      const when = document.createElement("span");
      when.className = "w";
      when.textContent = d === 0 ? "due today" : d < 0 ? `overdue ${-d}d` : shortDate(t.due);
      a.append(label, when);
      li.appendChild(a);
      return li;
    }
    function renderToday(allTasks) {
      const open = allTasks.filter((t) => tasks.isOpen(t) && t.due);
      const due = open.filter((t) => daysUntil(t.due) <= 0).sort((a, b) => a.due.localeCompare(b.due));
      const box = $("task-body");
      box.innerHTML = "";
      const list = document.createElement("ul");
      list.className = "task-list";
      if (due.length) {
        for (const t of due) list.appendChild(taskRow(t));
        box.appendChild(list);
      } else {
        const n = document.createElement("p");
        n.className = "task-none";
        n.textContent = "Nothing due today.";
        box.appendChild(n);
        const soon = open.filter((t) => daysUntil(t.due) > 0).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
        if (soon.length) {
          const l = document.createElement("div");
          l.className = "label";
          l.style.marginTop = "24px";
          l.textContent = "Next up";
          const soonList = document.createElement("ul");
          soonList.className = "task-list";
          for (const t of soon) soonList.appendChild(taskRow(t));
          box.append(l, soonList);
        }
      }
      const more = document.createElement("p");
      more.className = "task-more";
      const link = document.createElement("a");
      link.href = "/tasks.html";
      link.textContent = "All tasks →";
      more.appendChild(link);
      box.appendChild(more);
    }

    function renderDeadline(m) {
      if (!m) { $("deadline-body").innerHTML = `<p class="task-none">No dates yet — set by the registration letter.</p>`; return; }
      $("deadline-body").innerHTML = `
        <p class="deadline-title"></p>
        <p class="deadline-when"><strong>${m.days === 0 ? "today" : `in ${m.days} day${m.days > 1 ? "s" : ""}`}</strong> · ${m.date}</p>`;
      $("deadline-body").querySelector(".deadline-title").textContent = m.title;
    }

    function renderStreak(dates, weekCount) {
      const s = computeStreak(dates);
      $("streak").textContent = `${weekCount} logged this week · ${s} day streak`;
    }
    function computeStreak(dates) {
      let n = 0;
      const d = new Date(today);
      if (!dates.has(todayIso)) d.setDate(d.getDate() - 1); // streak survives until the day is over
      while (dates.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }
    function weekCount(dates) {
      const monday = new Date(today);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      let n = 0;
      for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); if (dates.has(iso(d))) n++; }
      return n;
    }

    /* ---------- log form ----------
       Text is the source of truth: chips insert/remove #tag in the textarea,
       the lit state derives from the text, and the tag registry (daily/tags.md)
       feeds the # autosuggest. The pure rules live in lib/tags.js + logs.js;
       this page only wires DOM events to them. */
    function renderChips() {
      $("chips").innerHTML = CURATED.map((t) =>
        `<button type="button" class="chip" aria-pressed="false" data-tag="${t}" data-tip="${esc(TAG_DESCRIPTIONS[t])}">#${t}</button>`
      ).join("");
      $("chips").addEventListener("click", (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        const ta = $("log-text");
        const pos = ta.selectionStart ?? ta.value.length;
        ta.value = hasTag(ta.value, b.dataset.tag)
          ? removeTag(ta.value, b.dataset.tag)
          : insertTag(ta.value, b.dataset.tag, pos).text;
        const caret = Math.min(pos, ta.value.length);
        ta.focus(); ta.setSelectionRange(caret, caret);
        updateChips(); growLogBox();
      });
    }
    function updateChips() {
      const text = $("log-text").value;
      for (const b of $("chips").querySelectorAll(".chip"))
        b.setAttribute("aria-pressed", String(hasTag(text, b.dataset.tag)));
    }
    function growLogBox() {
      const ta = $("log-text");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 144) + "px"; // ~6 rows, then scrolls
    }

    /* --- # autosuggest --- */
    let suggestItems = [];
    let suggestIdx = 0;
    function hideSuggest() { const box = $("log-suggest"); box.hidden = true; box.innerHTML = ""; suggestItems = []; }
    function updateSuggest() {
      const ta = $("log-text");
      const hit = tagAtCaret(ta.value, ta.selectionStart);
      const { curated, custom } = hit ? suggest(hit.prefix, [...registry.keys()]) : { curated: [], custom: [] };
      if (!hit || (!curated.length && !custom.length)) { hideSuggest(); return; }
      suggestItems = [...curated.map((t) => [t, 0]), ...custom.map((t) => [t, 1])];
      suggestIdx = 0;
      const box = $("log-suggest");
      box.innerHTML =
        (curated.length ? `<div class="s-label">Tags</div>` + curated.map((t) => sItemHtml(t, TAG_DESCRIPTIONS[t])).join("") : "") +
        (custom.length ? `<div class="s-label">Your tags</div>` + custom.map((t) => sItemHtml(t, "")).join("") : "");
      box.hidden = false;
      paintSuggest();
    }
    const sItemHtml = (t, desc) =>
      `<button type="button" class="s-item" data-tag="${t}"><span class="s-tag">#${t}</span>${desc ? `<span class="s-desc">${esc(desc)}</span>` : ""}</button>`;
    function paintSuggest() {
      [...$("log-suggest").querySelectorAll(".s-item")].forEach((b, i) => b.classList.toggle("sel", i === suggestIdx));
    }
    function acceptTag(tag) {
      const ta = $("log-text");
      const pos = ta.selectionStart;
      const cut = tagAtCaret(ta.value, pos)?.cutLength ?? 0;
      const { text, caret } = insertTag(ta.value.slice(0, pos - cut) + ta.value.slice(pos), tag, pos - cut);
      ta.value = text; ta.focus(); ta.setSelectionRange(caret, caret);
      hideSuggest(); updateChips(); growLogBox();
    }
    $("log-text").addEventListener("input", () => { updateChips(); growLogBox(); updateSuggest(); });
    $("log-text").addEventListener("keydown", (e) => {
      if (suggestItems.length) {
        if (e.key === "ArrowDown") { e.preventDefault(); suggestIdx = (suggestIdx + 1) % suggestItems.length; paintSuggest(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); suggestIdx = (suggestIdx - 1 + suggestItems.length) % suggestItems.length; paintSuggest(); }
        else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptTag(suggestItems[suggestIdx][0]); }
        else if (e.key === "Escape") hideSuggest();
        return;
      }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("log-form").requestSubmit(); }
    });
    $("log-text").addEventListener("blur", () => setTimeout(hideSuggest, 120));
    $("log-suggest").addEventListener("mousedown", (e) => {
      const b = e.target.closest(".s-item");
      if (b) { e.preventDefault(); acceptTag(b.dataset.tag); }
    });

    async function loadRegistry() {
      const f = await get("daily/tags.md").catch(() => null);
      registry = f ? parseRegistry(f.text) : new Map();
    }
    function renderTodayList(entries) {
      const box = $("log-today");
      const list = (entries || []).slice(-5).reverse();
      if (!list.length) { box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false;
      box.innerHTML = list.map((en) =>
        `<li><span class="lt-time">${esc(en.time)}</span><span class="lt-text">${esc(en.text)}${en.tags ? ` <span class="lt-tags">${esc(en.tags)}</span>` : ""}</span></li>`
      ).join("");
    }
    async function loadTodayEntries() {
      const f = await get(weekPath(today)).catch(() => null);
      renderTodayList(f ? parseLog(f.text)[todayIso] : []);
    }
    /* Every logged date seen in the vault — page state, so a save can update
       the streak without re-reading the vault. */
    const seenDates = new Set();
    async function loadStreakData() {
      seenDates.clear();
      let thisWeek = null;
      const monday = weekStart(today);
      for (let offset = 0; offset < 52; offset++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - offset * 7);
        const f = await get(weekPath(d)).catch(() => null);
        const found = f ? [...loggedDates(f.text)] : [];
        for (const x of found) seenDates.add(x);
        if (offset === 0) thisWeek = f ? f.text : null;
        if (offset > 0 && !found.length) break;   // a quiet completed week ends the streak
      }
      renderStreak(seenDates, weekCount(seenDates));
      return thisWeek;
    }
    /* Post-save rendering must NOT re-read the vault: production serves vault
       reads from the deployed asset snapshot, which lags the GitHub commit
       (possibly minutes). The week text this page just wrote is the freshest
       truth available — render the today list and streak from it. */
    function renderAfterSave(weekText) {
      seenDates.add(todayIso);
      renderStreak(seenDates, weekCount(seenDates));
      renderTodayList(parseLog(weekText)[todayIso]);
    }

    $("log-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const ta = $("log-text");
      const entry = toEntryLineText(ta.value);
      if (!entry) return;
      const flash = (msg) => {
        const saved = $("log-saved");
        saved.textContent = msg;
        saved.classList.remove("vt-flash"); void saved.offsetWidth; saved.classList.add("vt-flash");
      };
      const btn = $("log-submit");
      btn.disabled = true;
      let savedWeekText = null; // set when a real save lands — post-save render uses it
      try {
        if (demo) {
          flash("Saved (demo).");
        } else {
          const path = weekPath(today);
          const f = await get(path);
          const stamp = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
          const line = `- **${stamp}** ${entry}`;
          const newText = appendEntry(f ? f.text : null, todayIso, line);
          await put(path, newText, `log: ${entry.slice(0, 60)}`);
          /* free-form tags join the registry on first use */
          const adhocs = newAdHocs(entry, [...CURATED, ...registry.keys()]);
          if (adhocs.length) {
            for (const t of adhocs) registry.set(t, todayIso);
            await put("daily/tags.md", registryText(registry), `tags: ${adhocs.join(", ")}`);
          }
          flash("Saved.");
          savedWeekText = newText;
        }
        ta.value = "";
        growLogBox(); updateChips(); hideSuggest();
        if (savedWeekText !== null) renderAfterSave(savedWeekText);
        else { await loadStreakData(); await loadTodayEntries(); }
      } catch (err) {
        flash(`Could not save: ${err.message.slice(0, 80)}`);
      }
      btn.disabled = false;
    });

    async function loadDigest() {
      try {
        const r = await fetch("/research/papers/digest-latest.md");
        if (!r.ok) return;
        const n = ((await r.text()).match(/^- \*\*/gm) || []).length;
        if (!n) return;
        $("digest-section").hidden = false;
        $("digest-line").innerHTML = `<strong>${n} new papers</strong> matched your topics · <a href="/digest.html">open digest</a>`;
      } catch {}
    }

    /* ---------- boot ---------- */
    function showError(e) {
      $("app").hidden = false;
      $("task-body").innerHTML = `<p class="task-none">Could not load: ${e.message.slice(0, 100)}</p>`;
    }
    function boot(demoData) {
      $("app").hidden = false;
      $("today-date").textContent = fmtDay(today);
      if (demoData) {
        renderToday(demoData.tasks); renderDeadline(demoData.milestone);
        renderStreak(demoData.dates, weekCount(demoData.dates));
        return;
      }
      Promise.all([tasks.load({ list, get }), get("system/milestones/milestones.md")])
        .then(async ([allTasks, m]) => {
          renderToday(allTasks);
          renderDeadline(nextMilestone(m.text));
          await Promise.all([loadStreakData(), loadTodayEntries(), loadRegistry()]);
          await loadDigest();
        })
        .catch(showError);
    }

    if (demo) {
      const d = new Date(); const mk = (n) => { const x = new Date(d); x.setDate(d.getDate() + n); return iso(x); };
      const dates = new Set([iso(d), mk(-1), mk(-2), mk(-4), mk(-5), mk(-6)]);
      boot({ tasks: [{ status: "todo", due: mk(0), title: "Register coursework — Annexure 19, 12 credits" }], milestone: { title: "Joining & Registration", date: mk(5), days: 5 }, dates });
    } else {
      boot();
    }
    renderChips();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #ffffff;
      --ink: rgb(0 0 0 / 100%);
      --ink-2: rgb(0 0 0 / 64%);
      --ink-3: rgb(0 0 0 / 56%);
      --border: rgb(0 0 0 / 10%);
      --border-strong: rgb(0 0 0 / 18%);
      --hover: rgb(0 0 0 / 5%);
      --pressed: rgb(0 0 0 / 9%);
      --radius: 8px;
      --space: 8px;
      --maxw: 40rem;
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--canvas);
      font-feature-settings: "tnum" 1;
    }
    main {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    @media (min-width: 768px) { main { padding: 64px 24px 96px; } }

    /* ---------- nav ---------- */
    .nav { display: flex; align-items: baseline; gap: 18px; margin-bottom: 40px; font-size: 14px; }
    .nav .brand { font-weight: 600; margin-right: 10px; }
    .nav a { color: var(--ink-3); text-decoration: none; }
    .nav a:hover, .nav a:focus-visible { color: var(--ink); }
    .nav a[aria-current] { color: var(--ink); font-weight: 500; }

    /* ---------- header ---------- */
    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    .today { font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
    .streak { color: var(--ink-3); font-size: 15px; white-space: nowrap; }

    /* ---------- today's tasks ---------- */
    section { margin-top: 56px; }
    .label {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: 8px;
    }
    .task-list { list-style: none; padding: 0; margin: 0; }
    .task-list li { border-bottom: 1px solid var(--border); }
    .task-list li:last-child { border-bottom: none; }
    .task-list a {
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 13px 4px; text-decoration: none; color: var(--ink); border-radius: 4px;
    }
    .task-list a:hover, .task-list a:focus-visible { background: var(--hover); }
    .task-list .t { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
    .task-list .w { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
    .task-list .task-row.overdue .w { color: var(--ink); font-weight: 600; }
    .task-none { color: var(--ink-2); font-size: 17px; }
    .task-more { margin-top: 14px; font-size: 14px; }
    .task-more a { color: var(--ink-2); }
    .skip { color: var(--ink-3); }

    /* ---------- log ---------- */
    .log-row { display: flex; gap: 8px; }
    .log-input {
      flex: 1;
      font: inherit;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--canvas);
      color: var(--ink);
      min-width: 0;
    }
    .log-input::placeholder { color: var(--ink-3); }
    .log-input:focus-visible { outline: 2px solid var(--ink); outline-offset: 0; border-color: transparent; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      font: inherit; font-size: 14px; font-weight: 500;
      padding: 6px 12px;
      border: none; border-radius: 999px;
      background: var(--hover);
      color: var(--ink-2);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
      touch-action: manipulation;
    }
    .chip:hover { background: var(--pressed); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }

    /* ---------- buttons ---------- */
    button.primary, button.ghost {
      font: inherit; font-weight: 500;
      border-radius: var(--radius);
      cursor: pointer;
      min-height: 48px;
      transition: background 120ms ease;
      touch-action: manipulation;
    }
    button.primary { padding: 12px 20px; border: none; background: var(--ink); color: var(--canvas); }
    button.primary:hover { background: rgb(0 0 0 / 82%); }
    button.primary:active { background: rgb(0 0 0 / 72%); }
    button.ghost { padding: 12px 16px; border: none; background: none; color: var(--ink-2); }
    button.ghost:hover { background: var(--hover); color: var(--ink); }
    button:disabled { opacity: 0.5; cursor: default; }
    .ghost.done-task { padding: 0; min-height: 0; color: var(--ink-3); text-decoration: underline; text-underline-offset: 4px; }

    /* ---------- deadline ---------- */
    .deadline-title { font-size: 18px; font-weight: 500; }
    .deadline-when { color: var(--ink-2); font-size: 15px; margin-top: 4px; }
    .deadline-when strong { color: var(--ink); font-weight: 600; }

    /* ---------- saved feedback ---------- */
    .saved { color: var(--ink-2); font-size: 15px; margin-top: 10px; min-height: 1.4em; }

    /* ---------- footer ---------- */
    footer {
      margin-top: 72px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    footer a { color: var(--ink-3); text-decoration: none; font-size: 15px; }
    footer a:hover, footer a:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

    /* ---------- token gate ---------- */
    .gate p { color: var(--ink-2); margin-bottom: 16px; }
    .gate a { color: var(--ink); }
    .gate .log-input { width: 100%; }
    .gate .log-row { flex-direction: column; }
    .gate button.primary { margin-top: 12px; }
    [hidden] { display: none !important; }

    .skeleton { color: var(--ink-3); font-size: 15px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div id="app" hidden>
        <nav class="nav" aria-label="Site">
      <a class="brand" href="/">PhD-OS</a>
      <a href="/" aria-current="page">Today</a>
      <a href="/tasks.html">Tasks</a>
      <a href="/timeline.html">Timeline</a>
      <a href="/review.html">Review</a>
      <a href="/archive.html">Archive</a>
      <a href="/digest.html">Digest</a>
      <a href="/admin/">CMS</a>
      <a href="/logout">Sign out</a>
    </nav>
      <div class="date-row">
        <h1 class="today" id="today-date"></h1>
        <span class="streak" id="streak"></span>
      </div>

      <section id="task-section">
        <div class="label">Due today</div>
        <div id="task-body"><p class="skeleton">Loading…</p></div>
      </section>

      <section id="log-section">
        <div class="label">Log what you did</div>
        <form class="log-row" id="log-form">
          <input class="log-input" id="log-text" placeholder="One line is enough…" autocomplete="off" />
          <button class="primary" type="submit" id="log-submit">Log entry</button>
        </form>
        <div class="chips" id="chips"></div>
        <p class="saved" id="log-saved" role="status" aria-live="polite"></p>
      </section>

      <section id="deadline-section">
        <div class="label">Next milestone</div>
        <div id="deadline-body"><p class="skeleton">Loading…</p></div>
      </section>

      <section id="digest-section" hidden>
        <div class="label">New papers this week</div>
        <p class="task-none" id="digest-line"></p>
      </section>

      <footer>
        <span style="color: var(--ink-3); font-size: 15px;">Edits commit straight to your vault.</span>
      </footer>
    </div>
  </main>

  <script type="module">
    import { parseMilestones } from "/site/lib/milestones.js";
    import { parseTasks } from "/site/lib/tasks.js";
    import { weekPath, appendEntry, weekStart } from "/site/lib/logs.js";

    const demo = new URLSearchParams(location.search).get("demo") === "1";

    /* ---------- vault access (workouts model) ----------
       READS: same-origin static files deployed with the site (gated by login).
       WRITES: /api/write — server commits with the user's own OAuth token. */
    async function ghGet(path) {
      const r = await fetch(`/${path}`);
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`GET ${path}: ${r.status}`);
      return { text: await r.text(), meta: {} };
    }
    async function ghPut(path, text, _sha, msg) {
      const r = await fetch("/api/write", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, text, message: msg }),
      });
      if (r.status === 401) { location.href = "/login"; return new Promise(() => {}); }
      if (!r.ok) throw new Error(`PUT ${path}: ${r.status} ${await r.text()}`);
    }
    /* ---------- date helpers ---------- */
    const iso = (d) => d.toISOString().slice(0, 10);
    const today = new Date();
    const todayIso = iso(today);
    const fmtDay = (d) => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    const daysUntil = (dStr) => Math.round((new Date(dStr + "T12:00:00") - new Date(todayIso + "T12:00:00")) / 86400000);

    const TAGS = ["experiment", "paper", "reading", "idea", "coursework", "meeting", "admin"];
    const $ = (id) => document.getElementById(id);

    /* ---------- parsers ---------- */
    function nextMilestone(text) {
      const m = parseMilestones(text).items.find((i) => daysUntil(i.date) >= 0);
      return m ? { title: m.title, date: m.date, days: daysUntil(m.date) } : null;
    }
    function loggedDates(text) {
      const set = new Set();
      for (const m of text.matchAll(/^## (\d{4}-\d{2}-\d{2})$/gm)) set.add(m[1]);
      return set;
    }
    /* ---------- render ---------- */

    /* Everything due today, overdue included. Read-only here: each row links to the
       tasks page, which is the one place ticking happens. */
    const shortDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    function taskRow(t) {
      const d = daysUntil(t.due);
      const li = document.createElement("li");
      li.className = "task-row" + (d < 0 ? " overdue" : "");
      const a = document.createElement("a");
      a.href = `/tasks.html?focus=${encodeURIComponent(t.text)}`;
      const label = document.createElement("span");
      label.className = "t";
      label.textContent = t.text;
      const when = document.createElement("span");
      when.className = "w";
      when.textContent = d === 0 ? "due today" : d < 0 ? `overdue ${-d}d` : shortDate(t.due);
      a.append(label, when);
      li.appendChild(a);
      return li;
    }
    function renderToday(tasks) {
      const open = tasks.filter((t) => !t.done && t.due);
      const due = open.filter((t) => daysUntil(t.due) <= 0).sort((a, b) => a.due.localeCompare(b.due));
      const box = $("task-body");
      box.innerHTML = "";
      const list = document.createElement("ul");
      list.className = "task-list";
      if (due.length) {
        for (const t of due) list.appendChild(taskRow(t));
        box.appendChild(list);
      } else {
        const n = document.createElement("p");
        n.className = "task-none";
        n.textContent = "Nothing due today.";
        box.appendChild(n);
        const soon = open.filter((t) => daysUntil(t.due) > 0).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
        if (soon.length) {
          const l = document.createElement("div");
          l.className = "label";
          l.style.marginTop = "24px";
          l.textContent = "Next up";
          const soonList = document.createElement("ul");
          soonList.className = "task-list";
          for (const t of soon) soonList.appendChild(taskRow(t));
          box.append(l, soonList);
        }
      }
      const more = document.createElement("p");
      more.className = "task-more";
      const link = document.createElement("a");
      link.href = "/tasks.html";
      link.textContent = "All tasks →";
      more.appendChild(link);
      box.appendChild(more);
    }

    function renderDeadline(m) {
      if (!m) { $("deadline-body").innerHTML = `<p class="task-none">No dates yet — set by the registration letter.</p>`; return; }
      $("deadline-body").innerHTML = `
        <p class="deadline-title"></p>
        <p class="deadline-when"><strong>${m.days === 0 ? "today" : `in ${m.days} day${m.days > 1 ? "s" : ""}`}</strong> · ${m.date}</p>`;
      $("deadline-body").querySelector(".deadline-title").textContent = m.title;
    }

    function renderStreak(dates, weekCount) {
      const s = computeStreak(dates);
      $("streak").textContent = `${weekCount} logged this week · ${s} day streak`;
    }
    function computeStreak(dates) {
      let n = 0;
      const d = new Date(today);
      if (!dates.has(todayIso)) d.setDate(d.getDate() - 1); // streak survives until the day is over
      while (dates.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }
    function weekCount(dates) {
      const monday = new Date(today);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      let n = 0;
      for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); if (dates.has(iso(d))) n++; }
      return n;
    }

    /* ---------- log form ---------- */
    const activeTags = new Set();
    function renderChips() {
      $("chips").innerHTML = TAGS.map((t) => `<button type="button" class="chip" aria-pressed="false" data-tag="${t}">#${t}</button>`).join("");
      $("chips").addEventListener("click", (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        const on = b.getAttribute("aria-pressed") === "true";
        b.setAttribute("aria-pressed", String(!on));
        on ? activeTags.delete(b.dataset.tag) : activeTags.add(b.dataset.tag);
      });
    }
    async function loadStreakData() {
      const dates = new Set();
      let thisWeek = null;
      const monday = weekStart(today);
      for (let offset = 0; offset < 52; offset++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - offset * 7);
        const f = await ghGet(weekPath(d)).catch(() => null);
        const found = f ? [...loggedDates(f.text)] : [];
        for (const x of found) dates.add(x);
        if (offset === 0) thisWeek = f ? f.text : null;
        if (offset > 0 && !found.length) break;   // a quiet completed week ends the streak
      }
      renderStreak(dates, weekCount(dates));
      return thisWeek;
    }

    $("log-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("log-text").value.trim();
      if (!text) return;
      const tags = [...activeTags].map((t) => `#${t}`).join(" ");
      const entry = tags ? `${text} ${tags}` : text;
      const btn = $("log-submit");
      btn.disabled = true;
      try {
        if (demo) {
          $("log-saved").textContent = "Saved (demo).";
        } else {
          const path = weekPath(today);
          const f = await ghGet(path);
          const stamp = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
          const updated = appendEntry(f ? f.text : null, todayIso, `- **${stamp}** ${entry}`);
          await ghPut(path, updated, f?.meta.sha, `log: ${entry.slice(0, 60)}`);
          $("log-saved").textContent = "Saved.";
          await loadStreakData();
        }
        $("log-text").value = "";
        [...activeTags].forEach((t) => { activeTags.delete(t); const c = $(`chips [data-tag="${t}"]`); if (c) c.setAttribute("aria-pressed", "false"); });
      } catch (err) { $("log-saved").textContent = `Could not save: ${err.message.slice(0, 80)}`; }
      btn.disabled = false;
    });

    async function loadDigest() {
      try {
        const r = await fetch("/research/papers/digest-latest.md");
        if (!r.ok) return;
        const n = ((await r.text()).match(/^- \*\*/gm) || []).length;
        if (!n) return;
        $("digest-section").hidden = false;
        $("digest-line").innerHTML = `<strong>${n} new papers</strong> matched your topics · <a href="/digest.html">open digest</a>`;
      } catch {}
    }

    /* ---------- boot ---------- */
    function showError(e) {
      $("app").hidden = false;
      $("task-body").innerHTML = `<p class="task-none">Could not load: ${e.message.slice(0, 100)}</p>`;
    }
    function boot(demoData) {
      $("app").hidden = false;
      $("today-date").textContent = fmtDay(today);
      if (demoData) {
        renderToday(demoData.tasks); renderDeadline(demoData.milestone);
        renderStreak(demoData.dates, weekCount(demoData.dates));
        return;
      }
      Promise.all([ghGet("daily/tasks/tasks.md"), ghGet("system/milestones/milestones.md")])
        .then(async ([t, m]) => {
          renderToday(parseTasks(t.text));
          renderDeadline(nextMilestone(m.text));
          await loadStreakData();
          await loadDigest();
        })
        .catch(showError);
    }

    if (demo) {
      const d = new Date(); const mk = (n) => { const x = new Date(d); x.setDate(d.getDate() + n); return iso(x); };
      const dates = new Set([iso(d), mk(-1), mk(-2), mk(-4), mk(-5), mk(-6)]);
      boot({ tasks: [{ done: false, due: mk(0), text: "Register coursework — Annexure 19, 12 credits" }], milestone: { title: "Joining & Registration", date: mk(5), days: 5 }, dates });
    } else {
      boot();
    }
    renderChips();
  </script>
  <script type="module">
    try { const j = await (await fetch("/api/whoami")).json(); if (!j.login) document.querySelectorAll('a[href="/logout"]').forEach((a) => (a.hidden = true)); } catch {}
  </script>
</body>
</html>

</body>

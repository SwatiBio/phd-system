<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — timeline</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta" id="reg-line">Loading…</p>
      </header>

      <div class="note noprint mb-6">
        Every date is computed from the registration date — nothing here is stored. Change <code>reg</code> in
        <a href="/admin/#/collections/milestones">the milestones file</a> and the whole timeline moves.
      </div>

      <div class="card">
        <section>
          <div class="table-container"><table class="table" id="content"></table></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js" blocking="render"></script>
  <script type="module">
    import { parseMilestones } from "/site/lib/milestones.js";
    import { get } from "/site/lib/vault.js";

    const iso = (d) => d.toISOString().slice(0, 10);
    const todayIso = iso(new Date());
    const daysUntil = (dStr) => Math.round((new Date(dStr + "T12:00:00") - new Date(todayIso + "T12:00:00")) / 86400000);
    const fmtDate = (dStr) => new Date(dStr + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

    function render({ reg, note, items }) {
      const line = document.getElementById("reg-line");
      const box = document.getElementById("content");
      if (!reg) {
        line.textContent = "No registration date set yet.";
        box.innerHTML = `<p class="empty">Open the milestones file in the CMS and set <code>reg:</code> to your date of joining. Everything below appears at once.</p>`;
        return;
      }
      line.innerHTML = `Registration date: <strong>${fmtDate(reg)}</strong>${note ? ` · ${note.split("—")[0].trim().toLowerCase()}` : ""}`;
      if (!items.length) {
        box.innerHTML = `<p class="empty">No milestones with a <code>reg + offset</code> target found.</p>`;
        return;
      }
      const next = items.find((i) => daysUntil(i.date) >= 0);
      const rows = items.map((i) => {
        const days = daysUntil(i.date);
        const when = days < 0 ? `${-days}d ago` : days === 0 ? "today" : `in ${days}d`;
        const cls = days < 0 ? "past" : (next && i.date === next.date && i.title === next.title) ? "next" : "";
        return `<tr class="${cls}"><td class="date">${fmtDate(i.date)}</td><td class="in">${when}</td><td>${i.title}</td></tr>`;
      });
      box.innerHTML = `<thead><tr><th>Date</th><th>When</th><th>Milestone</th></tr></thead><tbody>${rows.join("")}</tbody>`;
    }

    try {
      const f = await get("system/milestones/milestones.md");
      if (!f) throw new Error("milestones file missing");
      render(parseMilestones(f.text));
    } catch (e) {
      document.getElementById("reg-line").textContent = "";
      document.getElementById("content").innerHTML = `<p class="empty">Could not load milestones: ${e.message}</p>`;
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — atlas</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
  <style>
    .atlas-wrap { display: flex; gap: 0; height: calc(100vh - 10rem); min-height: 400px; }
    .atlas-canvas { flex: 1; position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
    .atlas-canvas svg { width: 100%; height: 100%; }
    .atlas-sidebar { width: 22rem; flex-shrink: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    @media (max-width: 64rem) { .atlas-wrap { flex-direction: column; height: auto; } .atlas-sidebar { width: 100%; max-height: 50vh; } }
    .atlas-filters { display: flex; flex-wrap: wrap; gap: .375rem; margin-bottom: .5rem; }
    .filter-chip {
      font: inherit; font-size: 12px; font-weight: 500; padding: .2rem .5rem;
      border: 1px solid var(--border); border-radius: 999px; background: transparent;
      color: var(--muted-foreground); cursor: pointer; transition: all 120ms ease;
    }
    .filter-chip:hover { background: var(--muted); color: var(--foreground); }
    .filter-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .inspect-panel { border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; background: var(--card); }
    .inspect-panel h3 { font-size: .95rem; font-weight: 600; margin: 0 0 .375rem; }
    .inspect-panel p { font-size: 13px; color: var(--muted-foreground); margin: .25rem 0; }
    .inspect-panel a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
    .node-paper { fill: var(--primary); }
    .node-concept { fill: #6366f1; }
    .node-personal { stroke: var(--muted-foreground); stroke-dasharray: 4 2; }
    .node-ghost { fill: none; stroke: var(--muted-foreground); stroke-dasharray: 3 3; opacity: .5; }
    .link { stroke: var(--border); stroke-opacity: .6; }
    .status-to-read { fill: #94a3b8; }
    .status-reading { fill: #f59e0b; }
    .status-read { fill: #22c55e; }
    .status-parked { fill: #6b7280; }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta">Knowledge graph of your papers and concepts.</p>
      </header>

      <div class="atlas-wrap">
        <div class="atlas-canvas" id="canvas">
          <p class="meta" style="padding: 1rem">Loading papers…</p>
        </div>
        <div class="atlas-sidebar">
          <div class="atlas-filters" id="filters"></div>
          <div id="inspect" class="inspect-panel" hidden>
            <h3 id="inspect-title"></h3>
            <p id="inspect-meta"></p>
            <p id="inspect-concepts"></p>
            <p id="inspect-sparked"></p>
            <a id="inspect-link" href="#" target="_blank" rel="noopener">Open in CMS →</a>
          </div>
          <div id="legend" class="inspect-panel">
            <h3>Legend</h3>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;vertical-align:middle"></span> To read</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;vertical-align:middle"></span> Reading</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;vertical-align:middle"></span> Read</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#6366f1;vertical-align:middle"></span> Concept</p>
            <p style="font-size:12px;color:var(--muted-foreground);margin-top:.5rem">Drag nodes · Click to inspect · Scroll to zoom</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/site/lib/shell.js" blocking="render"></script>
  <script type="module">
    import { get, list } from "/site/lib/vault.js";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

    /* --- parse frontmatter --- */
    function parseFM(text) {
      const m = text.match(/^---\n([\s\S]*?)\n---/);
      if (!m) return {};
      const attrs = {};
      for (const line of m[1].split("\n")) {
        const kv = line.match(/^([a-z-]+):\s*(.*)$/);
        if (kv) {
          let v = kv[2].trim();
          if (v.startsWith("[") && v.endsWith("]")) v = v.slice(1, -1).split(",").map((s) => s.trim().replace(/^"|"$/g, ""));
          else if (v === "[]") v = [];
          attrs[kv[1]] = v;
        }
      }
      // extract "Sparked" section from body
      const body = text.slice(m[0].length);
      const sparked = body.match(/## Sparked\n([\s\S]*?)(?=\n## |$)/);
      attrs._sparked = sparked ? sparked[1].trim() : "";
      return attrs;
    }

    /* --- load data --- */
    const papersRaw = await list("research/papers");
    const conceptsRaw = await list("research/concepts");
    const papers = [];
    const concepts = [];

    for (const f of papersRaw) {
      if (!f.name.endsWith(".md") || f.name.startsWith("digest-")) continue;
      const r = await get(f.path);
      if (!r) continue;
      const fm = parseFM(r.text);
      if (fm.category === "personal") continue; // privacy rule
      papers.push({ ...fm, _path: f.path, _slug: f.name.replace(/\.md$/, ""), _type: "paper" });
    }
    for (const f of conceptsRaw) {
      if (!f.name.endsWith(".md")) continue;
      const r = await get(f.path);
      if (!r) continue;
      const fm = parseFM(r.text);
      concepts.push({ ...fm, _path: f.path, _slug: f.name.replace(/\.md$/, ""), _type: "concept" });
    }

    /* --- build nodes + links --- */
    const conceptSlugs = new Set(concepts.map((c) => c._slug));
    const nodes = [];
    const links = [];
    const nodeMap = {};

    for (const c of concepts) {
      const id = `c:${c._slug}`;
      nodes.push({ id, label: c.title || c._slug, type: "concept", data: c });
      nodeMap[id] = true;
    }
    for (const p of papers) {
      const id = `p:${p._slug}`;
      const radius = 6;
      nodes.push({ id, label: (p.title || "").slice(0, 40), type: "paper", status: p.status || "to-read", data: p, radius });
      nodeMap[id] = true;
      // paper -> concept links
      const pconcepts = Array.isArray(p.concepts) ? p.concepts : [];
      for (const cs of pconcepts) {
        const cid = `c:${cs}`;
        if (nodeMap[cid]) links.push({ source: id, target: cid, type: "concept" });
      }
    }
    // shared-author links between papers
    for (let i = 0; i < papers.length; i++) {
      for (let j = i + 1; j < papers.length; j++) {
        const a1 = Array.isArray(papers[i].authors) ? papers[i].authors : [];
        const a2 = Array.isArray(papers[j].authors) ? papers[j].authors : [];
        if (a1.some((x) => a2.includes(x)) && a1.length) {
          links.push({ source: `p:${papers[i]._slug}`, target: `p:${papers[j]._slug}`, type: "author" });
        }
      }
    }

    /* --- filters --- */
    const statusCounts = {};
    for (const p of papers) statusCounts[p.status || "to-read"] = (statusCounts[p.status || "to-read"] || 0) + 1;
    let activeFilter = null;
    function renderFilters() {
      const chips = [["all", papers.length + concepts.length], ...Object.entries(statusCounts)];
      $("filters").innerHTML = chips.map(([k, n]) =>
        `<button class="filter-chip" data-filter="${k}" aria-pressed="${(!activeFilter && k === 'all') || activeFilter === k}">${k} (${n})</button>`
      ).join("");
      $("filters").addEventListener("click", (e) => {
        const b = e.target.closest(".filter-chip");
        if (!b) return;
        const f = b.dataset.filter;
        activeFilter = f === "all" ? null : f;
        renderFilters();
        updateVisibility();
      });
    }
    function updateVisibility() {
      d3.selectAll(".node").style("opacity", (d) => {
        if (!activeFilter) return 1;
        if (d.type === "concept") return 1;
        return d.status === activeFilter ? 1 : 0.1;
      });
    }
    renderFilters();

    /* --- D3 force graph --- */
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js";
    script.onload = () => {
      const container = $("canvas");
      const width = container.clientWidth;
      const height = container.clientHeight;
      container.innerHTML = "";
      const svg = d3.select(container).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
      const g = svg.append("g");
      // zoom
      svg.call(d3.zoom().scaleExtent([0.2, 5]).on("zoom", (e) => g.attr("transform", e.transform)));

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id((d) => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-120))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius((d) => (d.radius || 6) + 4));

      const link = g.append("g").selectAll("line").data(links).join("line")
        .attr("class", "link")
        .attr("stroke-dasharray", (d) => d.type === "author" ? "4 2" : "none");

      const node = g.append("g").selectAll("circle").data(nodes).join("circle")
        .attr("class", (d) => `node node-${d.type}${d.status ? ` status-${d.status}` : ""}`)
        .attr("r", (d) => d.type === "concept" ? 10 : (d.radius || 6))
        .attr("fill", (d) => d.type === "concept" ? "#6366f1" : undefined)
        .style("cursor", "pointer")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        );

      // labels for concepts
      g.append("g").selectAll("text").data(nodes.filter((d) => d.type === "concept")).join("text")
        .text((d) => d.label)
        .attr("font-size", "11px").attr("fill", "var(--muted-foreground)")
        .attr("dx", 14).attr("dy", 4);

      // click to inspect
      node.on("click", (e, d) => {
        e.stopPropagation();
        const p = d.data;
        $("inspect").hidden = false;
        $("inspect-title").textContent = p.title || d.label;
        const meta = [];
        if (p.authors && p.authors.length) meta.push(p.authors.slice(0, 3).join(", ") + (p.authors.length > 3 ? " et al." : ""));
        if (p.status) meta.push(p.status);
        $("inspect-meta").textContent = meta.join(" · ");
        const con = Array.isArray(p.concepts) ? p.concepts : [];
        $("inspect-concepts").textContent = con.length ? `Concepts: ${con.join(", ")}` : "";
        $("inspect-sparked").textContent = p._sparked ? `Sparked: ${p._sparked.slice(0, 120)}` : "";
        $("inspect-link").href = `/admin/#/collections/${d.type === "concept" ? "concepts" : "papers"}/entries/${p._slug}`;
      });

      svg.on("click", () => { $("inspect").hidden = true; });

      simulation.on("tick", () => {
        link.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
        node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
        g.selectAll("text").attr("x", (d) => d.x).attr("y", (d) => d.y);
      });
    };
    document.head.appendChild(script);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PhD-OS — atlas</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("themeMode");
        if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" blocking="render"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="/site/lib/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer blocking="render"></script>
  <style>
    .atlas-wrap { display: flex; gap: 0; height: calc(100vh - 10rem); min-height: 400px; }
    .atlas-canvas { flex: 1; position: relative; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
    .atlas-canvas svg { width: 100%; }
    .atlas-sidebar { width: 22rem; flex-shrink: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    @media (max-width: 64rem) { .atlas-wrap { flex-direction: column; height: auto; } .atlas-sidebar { width: 100%; max-height: 50vh; } }
    .atlas-filters { display: flex; flex-wrap: wrap; gap: .375rem; margin-bottom: .5rem; }
    .filter-chip {
      font: inherit; font-size: 12px; font-weight: 500; padding: .2rem .5rem;
      border: 1px solid var(--border); border-radius: 999px; background: transparent;
      color: var(--muted-foreground); cursor: pointer; transition: all 120ms ease;
    }
    .filter-chip:hover { background: var(--muted); color: var(--foreground); }
    .filter-chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; position: sticky; top: 0; z-index: 10; background: var(--card); }
    .view-toggle button {
      font: inherit; font-size: 12px; font-weight: 500; padding: .25rem .75rem;
      border: none; background: transparent; color: var(--muted-foreground); cursor: pointer;
    }
    .view-toggle button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
    .inspect-panel { border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; background: var(--card); }
    .inspect-panel h3 { font-size: .95rem; font-weight: 600; margin: 0 0 .375rem; }
    .inspect-panel p { font-size: 13px; color: var(--muted-foreground); margin: .25rem 0; }
    .inspect-panel a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
    .node-paper { fill: var(--primary); }
    .node-concept { fill: #6366f1; }
    .status-to-read { fill: #94a3b8; }
    .status-reading { fill: #f59e0b; }
    .status-read { fill: #22c55e; }
    .status-parked { fill: #6b7280; }
    .link { stroke: var(--border); stroke-opacity: .6; }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <header class="page-head">
        <p class="meta">Knowledge graph and timeline of your papers and concepts.</p>
      </header>
      <div class="atlas-wrap">
        <div class="atlas-canvas" id="canvas">
          <p class="meta" style="padding: 1rem">Loading papers…</p>
        </div>
        <div class="atlas-sidebar">
          <div class="view-toggle" id="view-toggle">
            <button data-view="graph" aria-pressed="true">Graph</button>
            <button data-view="timeline" aria-pressed="false">Timeline</button>
            <button data-view="tags" aria-pressed="false">Tags</button>
          </div>
          <div class="atlas-filters" id="filters"></div>
          <div id="inspect" class="inspect-panel" hidden>
            <div style="display:flex;justify-content:space-between;align-items:start">
              <h3 id="inspect-title" style="flex:1;min-width:0"></h3>
              <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" id="inspect-close" aria-label="Close" style="flex-shrink:0;margin:-.25rem -.5rem 0 0">
                <i class="ph ph-x"></i>
              </button>
            </div>
            <p id="inspect-meta"></p>
            <p id="inspect-concepts"></p>
            <p id="inspect-sparked"></p>
            <a id="inspect-link" href="#" target="_blank" rel="noopener">Open in CMS →</a>
          </div>
          <div id="legend" class="inspect-panel">
            <h3>Legend</h3>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;vertical-align:middle"></span> To read</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;vertical-align:middle"></span> Reading</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;vertical-align:middle"></span> Read</p>
            <p><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#6366f1;vertical-align:middle"></span> Concept</p>
            <p style="font-size:12px;color:var(--muted-foreground);margin-top:.5rem">Drag nodes · Click to inspect · Scroll to zoom</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/site/lib/shell.js" blocking="render"></script>
  <script type="module">
    import { init } from "/site/lib/atlas.js";
    init(document.getElementById("canvas"), document.querySelector(".atlas-sidebar"));
  </script>
</body>
</html>

name = "phd-os"
compatibility_date = "2026-09-01"
# Static assets = the whole repo (workouts model): vault files deploy with the
# site and are gated by login (worker.js); the CMS shell at /admin stays public
# (Sveltia has its own login). No vault data is ever served unauthenticated.
main = "worker.js"

# Preserve dashboard-managed variables/secrets across wrangler deploys.
# (Without this, every deploy wipes GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET /
# AUTH_SESSION_SECRET added in the Cloudflare dashboard.)
keep_vars = true

# Static assets: site/ holds the morning brief (index.html) + the CMS (admin/).
[assets]
directory = "."
binding = "ASSETS"

[vars]
GITHUB_REPO = "SwatiBio/phd-system"
GITHUB_BRANCH = "main"
AUTH_ALLOWED_GITHUB_LOGINS = "SwatiBio"

# Zotero save target collection (Phd-OS)
ZOTERO_COLLECTION_KEY = "SBTY2T5N"

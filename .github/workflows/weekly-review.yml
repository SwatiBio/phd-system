name: Weekly review prep

# Publishes the week's review page (daily/reviews/latest.md) so the ritual shows
# up on its own. Gathering only — the verdicts happen with pi in chat.
on:
  schedule:
    - cron: "30 12 * * 0" # Sunday 12:30 UTC = 18:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather the week
        run: python3 .github/scripts/weekly_review.py
      - name: Commit
        run: |
          git config user.name "phd-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily/reviews/
          git diff --cached --quiet || git commit -m "weekly review: prep $(date -u +%F)"
          git push

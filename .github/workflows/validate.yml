name: Validate object definition

# The object model lives in one place (site/admin/config.yml). Two adapters create
# objects — the CMS form and .github/scripts/zotero_import.py — and they drifted
# apart once already. This is the check that keeps them honest.
on:
  push:
    paths:
      - "site/admin/config.yml"
      - ".github/scripts/zotero_import.py"
      - "validate-cms.py"
      - "research/**/*.md"
      - "later/publications/**/*.md"
  pull_request:
    paths:
      - "site/admin/config.yml"
      - ".github/scripts/zotero_import.py"
      - "validate-cms.py"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema
      - name: Schema + adapter conformance
        run: python validate-cms.py
